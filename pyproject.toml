[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ashlar-tabular"
dynamic = ["version"]
description = "Narrow JAX/Equinox tabular models with explicit weights and ensemble semantics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Maxwell Bay"}]
keywords = ["tabular", "jax", "equinox", "deep-learning", "distributional-regression", "forecasting", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.4.38",
  "equinox>=0.11",
  "optax>=0.2",
  "numpy>=1.26",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/maxmbay/ashlar"
Documentation = "https://github.com/maxmbay/ashlar/tree/main/docs"
Issues = "https://github.com/maxmbay/ashlar/issues"

[project.optional-dependencies]
dataframes = ["pandas>=2.0", "polars>=1.0"]
dev = ["pandas>=2.0", "polars>=1.0", "pytest>=8.0"]

[tool.setuptools.dynamic]
version = {attr = "ashlar._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashlar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
