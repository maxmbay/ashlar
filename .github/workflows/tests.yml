name: tests

# Two tiers. Pull requests run the fast tier: every test not marked `slow`, which
# still fits and scores each head, spread over the runner's cores. The full suite,
# including the slow tests that check a fit recovers known parameters, runs on
# pushes to dev and main, nightly, and on demand (Actions > tests > Run workflow).
# The publish workflow runs the full suite again before a release.
#
# Most of the suite's time is XLA compilation, so JAX's persistent compilation
# cache is kept between runs; a warm cache cuts a file's time by about two thirds.

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite, slow tests included"
        type: boolean
        default: true

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAX_PLATFORMS: cpu
  JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
  JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Restore the JAX compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
            jax-${{ runner.os }}-
      - name: Choose the tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.full }}" = "false" ]; then
            echo "args=-m 'not slow'" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - run: eval pytest -n auto --durations=15 ${{ steps.tier.outputs.args }}
      - name: Keep the compilation cache small
        if: always()
        run: |
          # Entries for code that no longer exists pile up; start over past 1 GB.
          if [ -d .jax-cache ] && [ "$(du -sm .jax-cache | cut -f1)" -gt 1024 ]; then rm -rf .jax-cache; fi
      - name: Save the JAX compilation cache
        if: always() && hashFiles('.jax-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
