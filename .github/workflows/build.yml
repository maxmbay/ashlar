name: build

on:
  push:
  pull_request:

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check the links on the README and every docs page, then point the README's at this commit for PyPI
        run: |
          python examples/readme/absolute_urls.py --check
          for page in docs/*.md; do python examples/readme/absolute_urls.py --check "$page"; done
          python examples/readme/absolute_urls.py --ref "${{ github.sha }}"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import ashlar; print(ashlar.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
