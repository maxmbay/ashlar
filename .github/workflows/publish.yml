name: publish

# Releases ride on version bumps. Every push to main reads src/ashlar/_version.py;
# when tag v<version> does not exist yet, this tests and builds the package,
# uploads it to PyPI (the `pypi` environment can require a reviewer's approval),
# then tags the commit and creates the GitHub Release from that version's
# CHANGELOG.md section. Pushes that leave the version alone do nothing.
#
# To release: one PR that bumps _version.py and renames the changelog's
# "Unreleased" heading to "## X.Y.Z — YYYY-MM-DD". Merge it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'\"(.+)\"', open('src/ashlar/_version.py').read()).group(1))")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "v${version} is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract the release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}. Add a \"## ${version} — YYYY-MM-DD\" heading."
            exit 1
          fi
          { echo "pip install -U ashlar-tabular==${version}"; echo; cat -s notes.md; } > release-notes.md
      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: pytest
        env:
          JAX_PLATFORMS: cpu

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import ashlar; print(ashlar.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ashlar-tabular
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag the commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.check.outputs.version }}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md
